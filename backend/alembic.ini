# Alembic configuration — DFS Edge Pro
#
# Run migrations:
#   cd backend
#   alembic upgrade head
#
# Create a new migration after modifying models:
#   alembic revision --autogenerate -m "describe change"
#
# Show current revision:
#   alembic current
#
# Show migration history:
#   alembic history --verbose

[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is set dynamically in alembic/env.py from DATABASE_URL
# so we leave it blank here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
