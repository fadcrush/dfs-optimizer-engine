<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}DFS Engine{% endblock %}</title>

  <style>
    :root{
      --bg: #0b0f14;
      --panel: #0f1620;
      --panel2:#121c28;
      --text:#e8eef6;
      --muted:#a5b3c2;
      --line:#223246;
      --accent:#46a6ff;
      --good:#2bd67b;
      --warn:#ffcb3d;
      --bad:#ff5d5d;
      --shadow: 0 6px 20px rgba(0,0,0,.35);
      --radius: 12px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(900px 600px at 15% -5%, #152033 0%, var(--bg) 55%),
                  radial-gradient(900px 600px at 85% 0%, #1a2b46 0%, var(--bg) 60%);
      color:var(--text);
    }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,15,20,.75);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight:700;
      letter-spacing:.4px;
    }
    .logo{
      width:28px;height:28px;border-radius:8px;
      background: linear-gradient(135deg, #46a6ff 0%, #2bd67b 100%);
      box-shadow: var(--shadow);
    }
    .nav{ display:flex; gap:10px; flex-wrap:wrap; }
    .nav a{
      padding: 8px 12px;
      border-radius: 10px;
      border:1px solid transparent;
      color:var(--muted);
      background: transparent;
    }
    .nav a.active, .nav a:hover{
      color:var(--text);
      border-color: var(--line);
      background: rgba(18,28,40,.55);
    }

    .container{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    .card{
      background: linear-gradient(180deg, rgba(18,28,40,.95) 0%, rgba(15,22,32,.95) 100%);
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin: 14px 0;
      box-shadow: var(--shadow);
    }
    .card h2, .card h3{ margin: 0 0 10px; }
    .muted{ color: var(--muted); font-size: 13px; }

    .grid{ display:grid; gap: 14px; }
    .grid.two{ grid-template-columns: 1fr 1fr; }
    @media (max-width: 900px){ .grid.two{ grid-template-columns: 1fr; } }

    .row{ display:flex; align-items:center; gap: 10px; flex-wrap:wrap; }

    input[type="file"], select, input[type="number"], input[type="text"], textarea{
      background: rgba(11,15,20,.6);
      border:1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 10px;
      outline: none;
      width: 100%;
    }
    input[type="number"]{ max-width: 140px; }

    button{
      background: linear-gradient(135deg, #46a6ff 0%, #3a7bfd 100%);
      border: none;
      color: #061019;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    button.secondary{
      background: rgba(30,42,58,.8);
      color: var(--text);
      border:1px solid var(--line);
    }

    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30,42,58,.9);
      border:1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      white-space:nowrap;
    }
    .pill.good{ border-color: rgba(43,214,123,.35); }
    .pill.warn{ border-color: rgba(255,203,61,.35); }
    .pill.bad{ border-color: rgba(255,93,93,.35); }

    table{
      width:100%;
      border-collapse: collapse;
      border-radius: 12px;
      border:1px solid var(--line);
      overflow:hidden;
      background: rgba(11,15,20,.35);
    }
    th, td{
      padding: 9px 8px;
      border-bottom:1px solid rgba(34,50,70,.8);
      font-size: 13px;
    }
    th{
      text-align:left;
      background: rgba(18,28,40,.7);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:hover td{ background: rgba(18,28,40,.25); }

    .alert{
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid var(--line);
      background: rgba(18,28,40,.75);
    }
    .alert.error{ border-color: rgba(255,93,93,.35); }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <nav class="topbar">
    <div class="logo">DFS Engine</div>
    <div class="nav-links">
        <a href="/" {% block home_active %}{% endblock %}>Home</a>
        <a href="/nba/dashboard/" {% block nba_active %}{% endblock %}>NBA</a>
        <a href="/nba/selector/" {% block selector_active %}{% endblock %}>Selector</a>
        <a href="/nfl/dashboard/" {% block nfl_active %}{% endblock %}>NFL</a>
        <a href="/admin/">Admin</a>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
