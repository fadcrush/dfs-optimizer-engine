[build-system]
requires = ["hatchling>=1.25.0", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "dfs-backend"
version = "0.1.0"
description = "DFS Edge Pro backend services and API"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
