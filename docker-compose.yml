# ─────────────────────────────────────────────────────────────────────────────
# DFS Edge Pro — Docker Compose
#
# Quick start:
#   docker compose up --build
#
# Backend:  http://localhost:8000
# API docs: http://localhost:8000/docs
# Frontend: http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .                                   # project root
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env                                       # your local .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DFS_DISABLE_AUTH=1
    volumes:
      # Persist DuckDB files across rebuilds
      - ./data:/app/data
      # Persist uploaded slates (file_service saves to backend/uploads/)
      - ./backend/uploads:/app/backend/uploads
      # Persist output CSVs
      - ./outputs:/app/outputs
      # Live source code — changes reflected without rebuilding the image
      - ./analysis:/app/analysis
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./scripts:/app/scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # Read public keys from .env at BUILD TIME
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DISABLE_AUTH: 1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DISABLE_AUTH=1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis (Celery broker + result backend) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Celery worker (async optimizer / pipeline tasks) ─────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=celery
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/backend/uploads
      - ./outputs:/app/outputs
      - ./analysis:/app/analysis
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./scripts:/app/scripts
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
