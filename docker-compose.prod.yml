# ─────────────────────────────────────────────────────────────────────────────
# DFS Edge Pro — Production Compose override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file adds:
#   - Nginx reverse-proxy (SSL termination)
#   - Resource limits for backend & frontend
#   - Named volumes with explicit drivers
#   - Production env tweaks
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend overrides ───────────────────────────────────────────────────────
  backend:
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      - LOG_LEVEL=info
      - INJURY_DATA_FAIL_MODE=closed
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend overrides ──────────────────────────────────────────────────────
  frontend:
    restart: always
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro          # cert + key mounted here
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_cache:
    driver: local

  # ── Redis overrides ─────────────────────────────────────────────────────────
redis:
  restart: always
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M
      reservations:
        cpus: "0.1"
        memory: 128M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

  # ── Celery worker overrides ─────────────────────────────────────────────────
celery_worker:
  restart: always
  stop_grace_period: 60s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        cpus: "0.5"
        memory: 512M
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"
